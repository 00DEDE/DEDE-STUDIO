<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>I AM DĒDĒ.STUDIO</title>
<link rel="canonical" href="https://iamdede.com/home.html" />
<link rel="icon" type="image/png" sizes="96x96" href="ASSETS/LOGO/logo_favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="ASSETS/LOGO/apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#050505" />
<script>(function(){try{var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="site-bg.css" />
<link rel="prefetch" href="selections.html" />
<style>
  html { background: #050505; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    cursor: url("ASSETS/LOGO/cursor_dede.png") 16 16, auto;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Two DĒDĒ logos stacked in the same spot; JS toggles is-visible to
     cycle between them. Progressively faster over ~3s, then handoff. */
  .logo-cycle {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(60vw, 560px);
    height: min(60vh, 500px);
  }
  .logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity var(--dur-instant) var(--ease-out-expo);
    display: block;
  }
  .logo.is-visible { opacity: 1; }

  .logo--horizontal {
    /* 60% smaller than the previous sizing (×0.4). */
    width: clamp(112px, 13.6vw, 208px);
    height: auto;
  }
  .logo--stacked {
    /* 60% smaller than the previous sizing (×0.4). */
    width: clamp(80px, 9.6vw, 144px);
    height: auto;
  }

  /* Organic jellyfish breathing — multi-key asymmetric pulse with a
     subtle vertical drift, so the logo feels alive rather than
     mechanically pulsing. Each cycle: quick inhale, hold, slow exhale,
     gentle undershoot, back to rest. Cycle ends exactly at scale(1) /
     translateY(0), matching the base transform, so removing the class
     after N full cycles doesn't snap. */
  .logo.is-breathing {
    animation: logo-breathe 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    transform-origin: center center;
    will-change: transform;
  }
  @keyframes logo-breathe {
    0%   { transform: translate(-50%, -50%) scale(1)     translateY(0px);  }
    18%  { transform: translate(-50%, -50%) scale(1.07)  translateY(-6px); }
    32%  { transform: translate(-50%, -50%) scale(1.11)  translateY(-9px); }
    50%  { transform: translate(-50%, -50%) scale(1.02)  translateY(-2px); }
    65%  { transform: translate(-50%, -50%) scale(0.965) translateY(5px);  }
    82%  { transform: translate(-50%, -50%) scale(1.01)  translateY(1px);  }
    100% { transform: translate(-50%, -50%) scale(1)     translateY(0px);  }
  }

  /* Hand-off: a gentle opacity fade instead of a scale burst. The
     breathing continues underneath until the class swap, then this
     takes over for the exit. */
  .logo.is-fading {
    animation: logo-fade-out 700ms var(--ease-out-expo) forwards;
  }
  @keyframes logo-fade-out {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo { transition: none; }
    .logo.is-breathing,
    .logo.is-fading { animation: none; }
  }
</style>
</head>
<body>
  <div class="site-bg" aria-hidden="true">
    <div class="site-bg__blob site-bg__blob--cyan-1"></div>
    <div class="site-bg__blob site-bg__blob--cyan-2"></div>
    <div class="site-bg__blob site-bg__blob--dark-1"></div>
    <div class="site-bg__blob site-bg__blob--dark-2"></div>
  </div>

  <div class="logo-cycle" role="status" aria-label="Loading DĒDĒ.STUDIO">
    <img class="logo logo--horizontal is-visible"
         src="ASSETS/LOGO/logo_horizontal_cyan.png"
         alt="DĒDĒ STUDIO" />
    <img class="logo logo--stacked"
         src="ASSETS/LOGO/logo_stacked_cyan.png"
         alt="DĒDĒ STUDIO" />
  </div>

  <script>
    (function () {
      const logos = document.querySelectorAll('.logo-cycle .logo');
      const STACKED_INDEX    = 1;      // .logo--stacked is the second img
      const DURATION_MS      = 5000;   // total cycle window
      const START_INTERVAL   = 420;    // graceful cadence at t=0
      const END_INTERVAL     = 40;     // rapid cadence at t=DURATION
      const FLOAT_MS         = 2000;   // stacked logo breathes for 2s (2 pulses)
      const SCALE_OUT_MS     = 1400;   // matches the CSS animation
      const REDIRECT_AT_MS   = 900;    // navigate while logo still covers viewport

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        window.location.replace('selections.html');
        return;
      }

      let active = 0;
      const start = performance.now();

      function show(idx) {
        logos[active].classList.remove('is-visible');
        active = idx;
        logos[active].classList.add('is-visible');
      }

      function tick() {
        const elapsed = performance.now() - start;

        // Standard swap during the cycling window.
        show((active + 1) % logos.length);

        if (elapsed >= DURATION_MS) {
          // Force the last frame onto the stacked logo, then start the
          // 2-second breathing pause before the final scale-out reveal.
          if (active !== STACKED_INDEX) {
            setTimeout(() => { show(STACKED_INDEX); startFloat(); }, END_INTERVAL);
          } else {
            startFloat();
          }
          return;
        }

        // Interval shrinks from START → END with a squared curve — accelerates
        // gently at first, ramps up hard toward the end (rapid succession).
        const progress = elapsed / DURATION_MS;
        const nextInterval = START_INTERVAL
          - (START_INTERVAL - END_INTERVAL) * (progress * progress);
        setTimeout(tick, nextInterval);
      }

      function startFloat() {
        // Slow jellyfish-style pulse — two full breaths (2s at 1s per
        // cycle). Because each cycle ends at scale(1), swapping to the
        // scale-out below is a clean handoff with no visual snap.
        logos[STACKED_INDEX].classList.add('is-breathing');
        setTimeout(scaleOut, FLOAT_MS);
      }

      function scaleOut() {
        const stacked = logos[STACKED_INDEX];
        stacked.classList.remove('is-breathing');
        stacked.classList.add('is-scaling-out');
        // Hand off while the logo is at its most-covering point, so the
        // page swap happens under cover of the animation rather than as
        // a hard cut afterwards.
        setTimeout(() => window.location.replace('selections.html'), REDIRECT_AT_MS);
      }

      setTimeout(tick, START_INTERVAL);
    })();
  </script>
</body>
</html>
