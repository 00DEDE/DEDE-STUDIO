<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>I AM DĒDĒ.STUDIO</title>
<link rel="canonical" href="https://iamdede.com/home.html" />
<link rel="icon" type="image/png" sizes="96x96" href="ASSETS/LOGO/logo_favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="ASSETS/LOGO/apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#050505" />
<script>(function(){try{var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="site-bg.css" />
<link rel="prefetch" href="selections.html" />
<style>
  html { background: #050505; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    cursor: url("ASSETS/LOGO/cursor_dede.png") 16 16, auto;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Two DĒDĒ logos stacked in the same spot; JS toggles is-visible to
     cycle between them. Progressively faster over ~3s, then handoff. */
  .logo-cycle {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(60vw, 560px);
    height: min(60vh, 500px);
  }
  .logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    /* Slow, graceful crossfade between the two logos. */
    transition: opacity 1200ms ease-in-out;
    display: block;
  }
  .logo.is-visible { opacity: 1; }

  .logo--horizontal {
    /* 60% smaller than the previous sizing (×0.4). */
    width: clamp(112px, 13.6vw, 208px);
    height: auto;
  }
  .logo--stacked {
    /* 60% smaller than the previous sizing (×0.4). */
    width: clamp(80px, 9.6vw, 144px);
    height: auto;
  }

  /* Jellyfish breathing — one continuous, symmetric inhale-exhale.
     Only two keyframes plus a smooth ease-in-out timing function, so
     there are no velocity discontinuities and nothing to read as chop.
     Each cycle ends exactly at scale(1), matching the base transform,
     so removing the class after N full cycles hands off cleanly. */
  .logo.is-breathing {
    animation: logo-breathe 4s ease-in-out infinite;
    transform-origin: center center;
    will-change: transform;
  }
  @keyframes logo-breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1);    }
    50%      { transform: translate(-50%, -50%) scale(1.08); }
  }

  /* Hand-off: a gentle opacity fade instead of a scale burst. The
     breathing continues underneath until the class swap, then this
     takes over for the exit. */
  .logo.is-fading {
    animation: logo-fade-out 700ms var(--ease-out-expo) forwards;
  }
  @keyframes logo-fade-out {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo { transition: none; }
    .logo.is-breathing,
    .logo.is-fading { animation: none; }
  }
</style>
</head>
<body>
  <div class="site-bg" aria-hidden="true">
    <div class="site-bg__blob site-bg__blob--cyan-1"></div>
    <div class="site-bg__blob site-bg__blob--cyan-2"></div>
    <div class="site-bg__blob site-bg__blob--dark-1"></div>
    <div class="site-bg__blob site-bg__blob--dark-2"></div>
  </div>

  <div class="logo-cycle" role="status" aria-label="Loading DĒDĒ.STUDIO">
    <img class="logo logo--horizontal is-visible"
         src="ASSETS/LOGO/logo_horizontal_cyan.png"
         alt="DĒDĒ STUDIO" />
    <img class="logo logo--stacked"
         src="ASSETS/LOGO/logo_stacked_cyan.png"
         alt="DĒDĒ STUDIO" />
  </div>

  <script>
    (function () {
      const horizontal = document.querySelector('.logo--horizontal');
      const stacked    = document.querySelector('.logo--stacked');

      const HORIZONTAL_HOLD_MS = 1800;  // horizontal visible before crossfade
      const CROSSFADE_MS       = 1200;  // matches the CSS opacity transition
      const FLOAT_MS           = 8000;  // two full 4s breath cycles
      const REDIRECT_AT_MS     = 500;   // hand off mid-fade for smooth exit

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        window.location.replace('selections.html');
        return;
      }

      // 1. Crossfade horizontal → stacked (horizontal is visible at load
      //    via .is-visible in the HTML).
      setTimeout(() => {
        horizontal.classList.remove('is-visible');
        stacked.classList.add('is-visible');
        // 2. Once the crossfade completes, start the breathing.
        setTimeout(startFloat, CROSSFADE_MS);
      }, HORIZONTAL_HOLD_MS);

      function startFloat() {
        // Two full 4s jellyfish breath cycles. Each cycle ends at
        // scale(1) — matching the base transform — so removing the
        // class after FLOAT_MS hands off cleanly with no snap.
        stacked.classList.add('is-breathing');
        setTimeout(fadeOut, FLOAT_MS);
      }

      function fadeOut() {
        stacked.classList.remove('is-breathing');
        stacked.classList.add('is-fading');
        // Redirect mid-fade so the page swap happens while the logo
        // is still partially visible — smooths the transition.
        setTimeout(() => window.location.replace('selections.html'), REDIRECT_AT_MS);
      }
    })();
  </script>
</body>
</html>
