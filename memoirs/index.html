<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memoirs — IAMDEDE.COM</title>
<link rel="canonical" href="https://iamdede.com/memoirs/" />
<link rel="icon" type="image/png" sizes="96x96" href="/ASSETS/LOGO/favicon-96.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/ASSETS/LOGO/favicon-180.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0f0e0c" />
<script>(function(){try{var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="/site-header.css" />
<link rel="stylesheet" href="/site-footer.css" />
<link rel="stylesheet" href="/site-bg.css" />
<link rel="stylesheet" href="/site-mobile.css" />
<link rel="stylesheet" href="/case-study.css" />
<style>
  /* Per-page cursor — matches mind (UNESCO lives inside mind). */

  /* Page layout tokens, widow/orphan rules, hero/intro, grid skeleton,
     section-label, statement, read-more, media cells, pager, closing
     block and scroll-cue all live in /case-study.css. This inline
     block only carries UNESCO-specific overrides and page-unique
     components (scans marquee, palette grid, atlas viewer, tangible
     forms slideshow, foundations-after orchestrator, walkthrough
     videos). */

  /* ─── Cross-document View Transitions (page-specific) ─────────────
     Named morph target for the /work/ → /memoirs/ hero crossfade. The
     generic @view-transition opt-in and root fade timings are shared
     across every page and live in theme.css. */
  .unesco__hero-media { view-transition-name: memoirs-hero; }
  ::view-transition-group(memoirs-hero) {
    animation-duration: 620ms;
    animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
  }

  /* html/body base — margin/padding reset, bg, and global cursor all
     live in theme.css; only the UNESCO-specific font stack ("ABC
     Oracle" first) is set here. Widow/orphan rules live in
     case-study.css. */
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    width: 100%;
    color: var(--fg);
    overflow-x: clip;
    font-family: "ABC Oracle", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    cursor: var(--cursor-url) 12 12, auto;
  }

  /* Hairline rule separating the UNESCO page's major sections — a
     1px --line across the content inset by --page-x on both sides so
     it matches the page gutter. Added to every section after the
     intro and to the pager/footer so the whole page reads as discrete
     chapters. The hero sits at the very top of the page; the
     site-header already draws a hairline in that spot, so a border-
     top there would double-rule. (Intro/meta typography and base
     .unesco__intro padding live in case-study.css.) */
  .unesco__atlas,
  .unesco__grid,
  .unesco__foundations,
  .unesco__closing,
  .pager,
  body > .site-footer {
    border-top: 1px solid var(--line);
  }
  .unesco__hero.unesco__grid { border-top: 0; }

  /* ═══════════════════════════════════════════════════════════════════
     HERO — clean full-bleed image (Manual pattern). Rounded container
     matches the source cell so the view-transition morph lands clean.
     ═══════════════════════════════════════════════════════════════════ */
  /* Hero uses the shared .unesco__grid layout (title in col 1, image
     in cols 2-3) with extra top breathing room for the first row
     of content below the header. */
  .unesco__hero.unesco__grid {
    padding-top: var(--stack-top);
  }
  .unesco__hero-title {
    display: flex;
    flex-direction: column;
    gap: clamp(0.9rem, 2vh, 1.5rem);
  }
  .unesco__hero-title .intro__eyebrow { margin-bottom: 0; }
  .unesco__hero-title .intro__title { margin-bottom: 0; }
  .unesco__hero-media {
    position: relative;
    width: 100%;
    /* 16:10 to match the source artwork; capped at 60vh so the whole
       image, plus the top of the Overview section below, stays in
       the first viewport. */
    aspect-ratio: 16 / 10;
    max-height: 60vh;
    margin: 0;
    overflow: hidden;
    background: #000;
  }

  /* ─── Keep the site-header locked to its compact (is-scrolled)
     state on this page. Only the home page should show the expanded
     big-logo look at the top; every other page, UNESCO included,
     stays small so the hero cover reads as the first real content. */
  body.unesco .site-header,
  body.unesco .site-header.is-scrolled {
    padding: 1.15rem 0 0.65rem;
  }
  body.unesco .site-header .site-header__brand img,
  body.unesco .site-header.is-scrolled .site-header__brand img {
    height: 1.75rem;
  }
  /* Pill sits INSIDE the UNESCO header on the far right, vertically
     aligned with the brand mark (not straddling the header's bottom
     edge like the shared desktop placement). Overrides the shared
     `top: calc(var(--header-safe-top) - 1.25rem)` default. */
  @media (min-width: 641px) {
    body.unesco .site-menu-btn {
      top: 0.55rem !important;
      right: clamp(1rem, 2vw, 1.75rem) !important;
    }
    body.unesco .site-menu-btn.is-placed {
      /* Keep the pill locked to the UNESCO header on this page — the
         sitewide drag/persist moves are suppressed here so the pill
         always reads as part of the header, not a floating chip. */
      top: 0.55rem !important;
      right: clamp(1rem, 2vw, 1.75rem) !important;
      left: auto !important;
    }
  }
  .unesco__hero-image {
    position: absolute;
    inset: 0;
    background-image: url("/ASSETS/IMAGES/MEMOIRS/hero.jpg");
    background-size: cover;
    background-position: center center;
  }

  /* ═══════════════════════════════════════════════════════════════════
     INTERACTIVE ATLAS — sub-section between hero and the 3-col grid.
     Big "Interactive Atlas" statement + read-more expand + rounded
     video below. Shares the same --page-x gutter and --stack-y
     rhythm as every other section on the page.
     ═══════════════════════════════════════════════════════════════════ */
  .unesco__atlas {
    padding: var(--stack-y) var(--page-x);
    box-sizing: border-box;
  }
  /* Atlas sits outside the main 3-col grid, so its section-label
     needs explicit breathing room above the statement. */
  .unesco__atlas > .section-label {
    display: block;
    margin: 0 0 clamp(1rem, 2vh, 1.75rem);
    padding-top: 0;
  }
  .unesco__atlas-media {
    position: relative;
    /* Capped at 75vh * 16/9 so the atlas video fits in a single
       viewport while the viewer scrolls through this section. */
    width: min(100%, calc(75vh * 16 / 9));
    margin: clamp(1.5rem, 3vh, 2.5rem) auto 0;
    aspect-ratio: 16 / 9;
    border-radius: 0;
    overflow: hidden;
    background: #000;
  }
  .unesco__atlas-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }

  /* Campaign-section posters — mobile reshuffle to put the two black
     posters side by side on the top row and the grey one centered on
     the second row. Hooked off the default .section-media__posters
     mobile layout in case-study.css (which stacks posters into a
     2-col grid at <=900px). */
  @media (max-width: 900px) {
    .section-media__posters--campaign > :nth-child(1) { grid-column: 1; grid-row: 1; }
    .section-media__posters--campaign > :nth-child(3) { grid-column: 2; grid-row: 1; }
    .section-media__posters--campaign > :nth-child(2) {
      grid-column: 1 / -1;
      grid-row: 2;
      width: calc(50% - (clamp(0.75rem, 1.5vw, 1.25rem) / 2));
      justify-self: center;
    }
  }

  /* Intro overview essay — single-column stack, since the intro body
     lives in g-span-2 (2/3 of the grid width). Keeps paragraphs
     within the shared --prose-max measure. */
  .unesco__intro .read-more__inner {
    max-width: var(--prose-max);
  }
  .unesco__intro .read-more__inner p {
    max-width: 100%;
    margin: 0 0 1em;
  }
  .unesco__intro .read-more__inner p:last-child { margin-bottom: 0; }

  /* Base .media cells, aspect-ratio variants, .media__img/__video
     fill behavior, and the .media-tab Waabi pattern live in
     case-study.css. UNESCO-specific component patterns below. */

  /* ─── Interactive Palette ─────────────────────────────────────────
     The original palette billboard image is the base. A 3×2 grid of
     hover regions sits on top (assuming the image lays out six colors
     in three columns, two rows). A veil (page-bg colored overlay)
     covers each region at the start and fades away in sequence when
     the grid enters the viewport, so each color on the image "appears"
     one by one. Hover/focus lays a soft dark scrim over the region
     and surfaces its name centered inside. */
  .palette-grid {
    position: relative;
    display: block;
    width: min(100%, calc(75vh * 16 / 9));
    aspect-ratio: 16 / 9;
    justify-self: center;
    margin-inline: auto;
    overflow: hidden;
  }
  .palette-grid__img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: var(--bg);
  }
  .palette-grid__cells {
    position: absolute;
    inset: 0;
    display: grid;
    /* Image is a strict 6-column billboard (no rows), so the hover
       regions sit in one row of six to match each color panel. */
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: 1fr;
  }
  .palette-swatch {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    margin: 0;
    background: none;
    border: 0;
    border-radius: 0;
    overflow: hidden;
    cursor: var(--cursor-url) 12 12, pointer;
  }

  /* Reveal veil — covers the cell at start, fades to 0 when .is-in
     is applied to the parent grid. Colored to match the page bg so
     the image appears to "develop" one color at a time. */
  .palette-swatch__veil {
    position: absolute;
    inset: 0;
    background: var(--bg);
    opacity: 1;
    pointer-events: none;
    transition: opacity 720ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .palette-grid.is-in .palette-swatch__veil { opacity: 0; }
  .palette-grid.is-in .palette-swatch:nth-child(1) .palette-swatch__veil { transition-delay:   0ms; }
  .palette-grid.is-in .palette-swatch:nth-child(2) .palette-swatch__veil { transition-delay: 150ms; }
  .palette-grid.is-in .palette-swatch:nth-child(3) .palette-swatch__veil { transition-delay: 300ms; }
  .palette-grid.is-in .palette-swatch:nth-child(4) .palette-swatch__veil { transition-delay: 450ms; }
  .palette-grid.is-in .palette-swatch:nth-child(5) .palette-swatch__veil { transition-delay: 600ms; }
  .palette-grid.is-in .palette-swatch:nth-child(6) .palette-swatch__veil { transition-delay: 750ms; }

  .palette-swatch__scrim {
    position: absolute;
    /* Extend 1px past the cell on every edge so sub-pixel gaps and
       the hairline seams inside the source billboard never leave
       slivers of the underlying image untouched by the scrim. */
    inset: -1px;
    background: rgba(0, 0, 0, 0.32);
    opacity: 0;
    pointer-events: none;
    transition: opacity 320ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .palette-swatch__name {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.15em;
    padding: 0.5rem;
    font-family: "ABC Oracle", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    /* 25% smaller than before (0.9/1.4vw/1.25 → 0.675/1.05vw/0.94). */
    font-size: clamp(0.675rem, 1.05vw, 0.94rem);
    line-height: 1.15;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #fff;
    text-align: center;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition:
      opacity   360ms cubic-bezier(0.16, 1, 0.3, 1),
      transform 360ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  /* Each word of the color name sits on its own line, stacked vertically. */
  .palette-swatch__name > span { display: block; }
  .palette-swatch:hover .palette-swatch__scrim,
  .palette-swatch:focus-visible .palette-swatch__scrim {
    opacity: 1;
  }
  .palette-swatch:hover .palette-swatch__name,
  .palette-swatch:focus-visible .palette-swatch__name {
    opacity: 1;
    transform: translateY(0);
  }
  .palette-swatch:focus-visible { outline: none; }

  @media (prefers-reduced-motion: reduce) {
    .palette-swatch__veil { transition: none; opacity: 0; }
    .palette-swatch__name { transition: opacity 180ms linear; }
  }

  /* ─── Scans marquee ────────────────────────────────────────────
     Two independent horizontal ticker rows between Overview and
     Foundation. Each row's .scans__track is driven by JS via
     translateX, with each image duplicated inline so the wrap is
     seamless. Hover pauses that row; vertical mouse wheel over the
     carousel is captured and scrubs the row horizontally.

     White paper is removed via mix-blend-mode: multiply against the
     white page background (--bg is #ffffff). Spiral binding shadows
     and binder holes will still ghost through faintly since this is
     a blend-mode trick, not a true alpha mask. */
  .scans {
    padding: var(--stack-y) 0;
    overflow: hidden;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  .scans__row {
    position: relative;
    overflow: hidden;
    /* No overscroll-behavior: contain — vertical wheel must chain
       through to the page so users can keep scrolling down. The JS
       handler only preventDefaults on horizontal gestures. */
    touch-action: pan-y;
  }
  .scans__row + .scans__row {
    margin-top: clamp(0.75rem, 1.5vh, 1.25rem);
  }
  .scans__track {
    display: flex;
    gap: clamp(0.75rem, 1.5vw, 1.25rem);
    width: max-content;
    will-change: transform;
  }
  .scans__track > img {
    /* "Half size" reference: each page thumbnail sits at about a
       third of viewport height so a row of them reads as a stream
       of notes, not a gallery of posters. */
    height: clamp(220px, 30vh, 320px);
    width: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    mix-blend-mode: multiply;
    background: transparent;
  }

  /* .media-pair and .foundations-ba layouts live in case-study.css. */

  /* ─── Applications + Campaign walkthrough videos ─────────────────
     The source screen recordings are 1920×1068, not a true 16:9
     (they'd sit inside the default .media--wide cell with black bars
     top and bottom). Override the cell's aspect-ratio to match the
     recording exactly so the video frame fills edge to edge with no
     letterbox. object-fit: fill keeps the ratio locked since the
     cell is already the video's native ratio. */
  .applications-walkthrough,
  .campaign-walkthrough {
    aspect-ratio: 1920 / 1068 !important;
    background: #000;
  }
  .applications-walkthrough__video,
  .campaign-walkthrough__video {
    object-fit: fill;
    background: #000;
  }

  /* ─── Foundation After-cell orchestrated slideshow (section 02) ──
     The After cell now carries three layers stacked: the logo reveal
     video (ping-pong forward + reverse once through), followed by two
     rebrand lockup stills. JS in the page body toggles .is-active on
     one layer at a time; CSS handles the crossfade. */
  .foundations-after { position: relative; }
  .foundations-after__layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 520ms ease-in-out;
    will-change: opacity;
    pointer-events: none;
  }
  .foundations-after__layer.is-active { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .foundations-after__layer { transition: none; }
  }

  /* ─── 4-slide applications slideshow (section 07) ────────────────
     Each cell cycles 4 images on a shared 16s loop (4s per slide,
     with a 1s crossfade overlap). Two cells, 8 images total — split
     equally between them. */
  .media__aslide {
    opacity: 0;
    animation: applications-slideshow 16s ease-in-out infinite;
    will-change: opacity;
  }
  .media__aslide--1 { animation-delay:  0s; }
  .media__aslide--2 { animation-delay:  4s; }
  .media__aslide--3 { animation-delay:  8s; }
  .media__aslide--4 { animation-delay: 12s; }

  @keyframes applications-slideshow {
    0%, 100% { opacity: 0; }
    6.25%    { opacity: 1; }   /* 1s fade-in */
    25%      { opacity: 1; }   /* 3s hold */
    31.25%   { opacity: 0; }   /* 1s fade-out, overlaps next slide */
  }

  @media (prefers-reduced-motion: reduce) {
    .media__aslide { animation: none; }
    .media__aslide--1 { opacity: 1; }
  }

  /* ─── Tangible Forms slideshow (section 08) ──────────────────────
     Two full-width landscape cells, stacked vertically. Each cell is
     the size of both earlier half-width cells combined, so each image
     renders large. object-fit: contain keeps every image fully in
     view (no edge crop) and lets the cell background show through as
     a thin matte on mismatched aspect ratios. */
  .tangible-forms {
    grid-template-columns: 1fr !important;
  }
  .tangible-forms__cell {
    background: var(--bg);
  }
  .tangible-forms__cell .media__tslide {
    object-fit: contain;
    background: var(--bg);
  }
  /* Only the first slide of the first cell (celebration-01) is
     zoomed 30% so the envelope reads at a stronger scale; every
     other image in the slideshow sits at its natural contain size. */
  .tangible-forms__cell .media__tslide.is-zoomed {
    transform: scale(1.3);
    transform-origin: center;
  }
  .media__tslide {
    opacity: 0;
    transition: opacity 600ms ease-in-out;
    will-change: opacity;
  }
  .media__tslide.is-active { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .media__tslide { transition: none; }
  }

  /* Read-more pulse, scroll-cue, media-tab, caption, .unesco__closing,
     .statement--closing, .unesco__closing-image and the .pager all
     live in case-study.css. */

  /* ─── 09 · Printed Atlas — spreads + timeline scrubber ──────────
     48 PDF pages in the stage (covers single, inner spreads double).
     Below the stage: a full-width timeline strip. Hovering anywhere
     along it sets a target page, and the stage crossfades toward
     that page one step at a time. With no hover, pages auto-advance
     forward, wrapping at 48 → 1. Two image layers (a/b) alternate
     front/back so each page swap is a soft crossfade. */
  .atlas-book {
    display: flex;
    flex-direction: column;
    gap: clamp(0.85rem, 1.75vh, 1.4rem);
    width: min(100%, calc(75vh * 1440 / 1008));
    justify-self: center;
    margin-inline: auto;
  }
  .atlas-book__stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1440 / 1008;
    /* Default is page-bg so the single-page covers (pg 1 and 48)
       letterbox invisibly against the site. Inner spreads fill the
       stage edge-to-edge so this bg is only ever seen on covers. */
    background: var(--bg, #ffffff);
    overflow: hidden;
    transition: background 300ms ease-in-out;
    /* Promote the stage to its own compositor layer so each page
       crossfade stays on the GPU — big perf win in Safari where the
       full-size spreads were causing main-thread repaints. */
    transform: translateZ(0);
    contain: layout paint;
  }
  /* Inner spreads only — darken the bg under them so any 1px gap
     between <img> and stage edge during crossfade is unobtrusive. */
  .atlas-book__stage.is-spread {
    background: #0a0a0a;
  }
  /* Thin delicate gradient hinting at the book's binding. Shown only
     on inner spreads (pages 2–47); hidden on the single-page covers. */
  .atlas-book__spine {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 22px;
    transform: translateX(-50%);
    background: linear-gradient(
      to right,
      rgba(0, 0, 0, 0)    0%,
      rgba(0, 0, 0, 0.14) 50%,
      rgba(0, 0, 0, 0)    100%
    );
    pointer-events: none;
    opacity: 0;
    transition: opacity 240ms ease-in-out;
    z-index: 3;
  }
  .atlas-book__stage.is-spread .atlas-book__spine { opacity: 1; }
  /* Two stacked image layers; one is always .is-active (opacity 1),
     the other crossfades in. Both use object-fit: contain so the
     single-page covers (pages 1 and 48) letterbox inside the spread
     aspect without stretching. The letterbox bars inherit the stage
     background, which is tuned to the cover's blue. */
  .atlas-book__spread {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    background: transparent;
    opacity: 0;
    transition: opacity 340ms ease-in-out;
    z-index: 1;
    /* Keep each layer on its own GPU surface so the crossfade is a
       composite-only animation. backface-visibility: hidden tames
       Safari's known compositing glitches on stacked <img>. */
    will-change: opacity;
    transform: translateZ(0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .atlas-book__spread.is-active {
    opacity: 1;
    z-index: 2;
  }

  /* ─── Timeline thumbnails ─────────────────────────────────────────
     A strip of 48 small thumbnails directly below the stage. Each
     cell shows the atlas page it represents, sized to the spread
     aspect. Hovering a thumb sets the target page; the stage
     crossfades toward it one step at a time. The current page is
     highlighted. On narrower viewports the strip stays the same
     width as the stage so the row still spans the whole book. */
  .atlas-book__timeline {
    position: relative;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(48, 1fr);
    gap: 2px;
    padding: 0;
    user-select: none;
    touch-action: pan-x;
  }
  .atlas-book__thumb {
    appearance: none;
    border: 0;
    padding: 0;
    margin: 0;
    width: 100%;
    /* 2× the previous height — portrait aspect gives each thumb
       twice the vertical pixels for the same cell width. Covers fit
       natively at this ratio; spreads crop in slightly from the
       sides, still legibly showing the page. */
    aspect-ratio: 720 / 1008;
    background-color: #eceae4;
    background-size: cover;
    background-position: center;
    cursor: pointer;
    opacity: 0.42;
    outline: 0 solid var(--accent);
    outline-offset: 0;
    transition:
      opacity    180ms ease,
      transform  180ms ease,
      outline    140ms ease;
    will-change: opacity, transform;
  }
  .atlas-book__thumb:hover,
  .atlas-book__thumb:focus-visible {
    opacity: 1;
    outline: none;
    transform: translateY(-3px);
  }
  .atlas-book__thumb.is-current {
    opacity: 1;
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    transform: translateY(-4px);
  }
  /* Hover tooltip — small page-number bubble that follows the cursor
     along the timeline, so visitors can see where they're about to
     jump without squinting at the thumbnails. */
  .atlas-book__timeline-tooltip {
    position: absolute;
    bottom: calc(100% + 0.35rem);
    left: 0;
    transform: translateX(-50%);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: var(--page);
    border: 1px solid currentColor;

  <script>
  /* ════════════════════════════════════════════════════════════════
     UNESCO page-specific interactions. Shared case-study behaviors
     (media-tab expand/collapse, scroll-cue fade, read-more toggle)
     live in /case-study.js and run automatically on page load.
     ════════════════════════════════════════════════════════════════ */
  (function () {
    'use strict';

    /* Scans marquee — two independent rows of notebook scans. Each
       row loops continuously leftward driven by requestAnimationFrame.
       Hover pauses that row. A vertical wheel over the row is captured
       (preventDefault) and translated into horizontal scrub; auto
       playback resumes 1.5s after the viewer stops wheeling. */
    (function () {
      var rows = document.querySelectorAll('.scans__row');
      if (!rows.length) return;
      var state = Array.prototype.map.call(rows, function (row) {
        return {
          row: row,
          track: row.querySelector('.scans__track'),
          speed: parseFloat(row.getAttribute('data-speed') || '0.5'),
          offset: 0,
          halfWidth: 0,
          paused: false,
          wheelTO: null
        };
      });

      function measure() {
        state.forEach(function (s) {
          /* The track holds the full set twice; one wrap cycle is
             half the track's measured scroll width. */
          s.halfWidth = s.track ? s.track.scrollWidth / 2 : 0;
        });
      }
      /* Measure once images have reported their intrinsic sizes. */
      window.addEventListener('load', measure);
      window.addEventListener('resize', measure);
      /* Also re-measure whenever any scan image finishes loading,
         since lazy-loaded images change the track width late. */
      state.forEach(function (s) {
        s.track && s.track.querySelectorAll('img').forEach(function (img) {
          if (!img.complete) img.addEventListener('load', measure, { once: true });
        });
      });
      measure();

      function tick() {
        state.forEach(function (s) {
          if (!s.halfWidth) return;
          if (!s.paused) s.offset -= s.speed;
          /* Wrap offset into [-halfWidth, 0) so the duplicate set
             seamlessly takes over as the first one scrolls past. */
          while (s.offset <= -s.halfWidth) s.offset += s.halfWidth;
          while (s.offset > 0) s.offset -= s.halfWidth;
          s.track.style.transform = 'translateX(' + s.offset + 'px)';
        });
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      state.forEach(function (s) {
        s.row.addEventListener('mouseenter', function () { s.paused = true; });
        s.row.addEventListener('mouseleave', function () {
          /* Only resume if no wheel scrub is still in its cooldown. */
          if (!s.wheelTO) s.paused = false;
        });
        s.row.addEventListener('wheel', function (e) {
          var dy = e.deltaY || 0;
          var dx = e.deltaX || 0;
          /* Only capture when the user is scrubbing horizontally
             (trackpad side-swipe or shift+wheel). A plain vertical
             wheel passes through so the page keeps scrolling normally
             even when the pointer is over the marquee. */
          if (Math.abs(dx) <= Math.abs(dy)) return;
          e.preventDefault();
          s.paused = true;
          s.offset -= dx;
          if (s.wheelTO) clearTimeout(s.wheelTO);
          s.wheelTO = setTimeout(function () {
            s.wheelTO = null;
            if (!s.row.matches(':hover')) s.paused = false;
          }, 1500);
        }, { passive: false });
      });
    })();

    /* Tangible Forms (section 08) — two long cells, each cycling its
       own stack of celebration stills. All cells share ONE timer so
       they transition in lockstep (cell A and cell B swap at the
       same moment, every time). Interval comes from the first cell's
       data-tangible-interval. The cycle pauses while every cell is
       offscreen; clicking a cell holds it on its current slide until
       the viewer clicks outside, at which point it resumes. The
       other cells keep ticking even while one is held. */
    (function () {
      var cells = document.querySelectorAll('.tangible-forms__cell');
      if (!cells.length) return;
      var interval = parseInt(cells[0].getAttribute('data-tangible-interval'), 10) || 5000;
      var registry = [];
      cells.forEach(function (cell) {
        var slides = cell.querySelectorAll('.media__tslide');
        if (slides.length < 2) return;
        registry.push({
          cell: cell,
          slides: slides,
          idx: 0,
          offscreen: true,
          userHold: false
        });
      });
      if (!registry.length) return;

      function advance(state) {
        state.slides[state.idx].classList.remove('is-active');
        state.idx = (state.idx + 1) % state.slides.length;
        state.slides[state.idx].classList.add('is-active');
      }
      // Single shared ticker — every cell that isn't offscreen or
      // user-held advances on the same beat.
      setInterval(function () {
        registry.forEach(function (state) {
          if (!state.offscreen && !state.userHold) advance(state);
        });
      }, interval);

      if ('IntersectionObserver' in window) {
        registry.forEach(function (state) {
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (ent) { state.offscreen = !ent.isIntersecting; });
          }, { threshold: 0.1 });
          io.observe(state.cell);
        });
      } else {
        registry.forEach(function (state) { state.offscreen = false; });
      }

      registry.forEach(function (state) {
        state.cell.addEventListener('click', function (e) {
          e.stopPropagation();
          state.userHold = true;
          state.cell.classList.add('is-user-held');
        });
      });
      document.addEventListener('click', function (e) {
        registry.forEach(function (state) {
          if (!state.userHold) return;
          if (!state.cell.contains(e.target)) {
            state.userHold = false;
            state.cell.classList.remove('is-user-held');
          }
        });
      });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          registry.forEach(function (state) { state.offscreen = true; });
        }
      });
    })();

    /* Foundation After-cell orchestrated slideshow — the After cell
       in section 02 stacks three layers: the logo-reveal video and
       two rebrand-lockup stills. One layer carries .is-active at a
       time; CSS crossfades between them. The forward video is
       already an internal ping-pong (blue → logo → blue), so one
       play per cycle is enough; a separate reverse play would just
       repeat the same animation visually. Cycle: fwd video plays
       once → lockup 2 holds → lockup 3 holds → back to fwd. */
    var fAfter = document.querySelector('.foundations-after');
    if (fAfter) {
      var faFwd  = fAfter.querySelector('.foundations-after__video--fwd');
      var faImg2 = fAfter.querySelector('.foundations-after__img--2');
      var faImg3 = fAfter.querySelector('.foundations-after__img--3');
      if (faFwd && faImg2 && faImg3) {
        var faLayers = [faFwd, faImg2, faImg3];
        var FA_PAUSE_MS   = 600;    // after video finishes before next layer
        var FA_IMG_HOLD   = 2800;   // how long each still is shown
        function faShow(el) {
          faLayers.forEach(function (l) {
            if (l === el) l.classList.add('is-active');
            else l.classList.remove('is-active');
          });
        }
        function faPlayFwd() {
          faShow(faFwd);
          try { faFwd.currentTime = 0; } catch (e) {}
          var p = faFwd.play();
          if (p && typeof p.catch === 'function') p.catch(function () {});
        }
        function faShowImg2() { faShow(faImg2); setTimeout(faShowImg3, FA_IMG_HOLD); }
        function faShowImg3() { faShow(faImg3); setTimeout(faPlayFwd,  FA_IMG_HOLD); }
        faFwd.addEventListener('ended', function () { setTimeout(faShowImg2, FA_PAUSE_MS); });
        /* Mobile Safari refuses .play() for offscreen videos even with
           muted + playsinline + autoplay, so wait for the cell to
           intersect the viewport, then start the cycle. */
        var faKicked = false;
        var faKick = function () {
          if (faKicked) return;
          faKicked = true;
          faPlayFwd();
        };
        if ('IntersectionObserver' in window) {
          var faIO = new IntersectionObserver(function (entries) {
            entries.forEach(function (ent) {
              if (ent.isIntersecting) { faKick(); faIO.disconnect(); }
            });
          }, { threshold: 0.15 });
          faIO.observe(fAfter);
        } else {
          faKick();
        }
      }
    }

    /* Palette grid — reveal the swatches in sequence once the grid
       enters the viewport. Keeps the animation in sync with when the
       viewer actually arrives at the Palette section. */
    var paletteGrid = document.querySelector('.palette-grid');
    if (paletteGrid) {
      if ('IntersectionObserver' in window) {
        var pObs = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              paletteGrid.classList.add('is-in');
              pObs.disconnect();
            }
          });
        }, { threshold: 0.25 });
        pObs.observe(paletteGrid);
      } else {
        paletteGrid.classList.add('is-in');
      }
    }

  })();

  /* ─── 09 · Printed atlas — thumbnail-scrubbed viewer ────────────
     The stage holds two <img> layers that crossfade on each page
     change. Below it, a strip of 48 thumbnail buttons (one per
     page). Hovering a thumb sets a target page; a ticker walks
     cur one step at a time toward target so the stage visibly
     "moves toward" the hovered page. With no hover, pages auto-
     advance forward every AUTO_MS and wrap at 48 → 1. */
  (function () {
    var book = document.getElementById('atlas-book');
    if (!book) return;

    var stage    = document.getElementById('atlas-stage');
    var layerA   = document.getElementById('atlas-a');
    var layerB   = document.getElementById('atlas-b');
    var timeline = document.getElementById('atlas-timeline');
    var tooltip  = document.getElementById('atlas-timeline-tooltip');
    var counter  = document.getElementById('atlas-counter');

    var TOTAL    = 48;
    var AUTO_MS  = 2600;   // dwell when no one is hovering
    var CHASE_MS = 160;    // one step toward target while hovering
    var cur       = 1;
    var target    = 1;
    var hovered   = false;
    var paused    = false;
    var tickTimer = null;

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function src(n)      { return '/ASSETS/IMAGES/UNESCO/BOOK/atlas-' + pad(n) + '.jpg'; }
    function thumbSrc(n) { return '/ASSETS/IMAGES/UNESCO/BOOK/atlas-thumb-' + pad(n) + '.jpg'; }
    function clamp(n) { return Math.max(1, Math.min(TOTAL, n)); }
    function isCover(n) { return n === 1 || n === TOTAL; }

    // Build the 48 thumbnail buttons once, in order, inside the
    // timeline. Each thumb carries its page index; CSS covers the
    // visuals. The tooltip element stays as the last child so it
    // paints over the thumbs.
    var thumbs = [];
    for (var i = 1; i <= TOTAL; i++) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'atlas-book__thumb';
      btn.setAttribute('aria-label', 'Jump to page ' + i + ' of ' + TOTAL);
      btn.setAttribute('data-page', String(i));
      // Dedicated small thumbnail (~240px wide, ~15 KB each) — avoids
      // asking Safari to downsample 48 copies of the 2400px full-size
      // JPG for the strip, which was the main source of lag.
      btn.style.backgroundImage = 'url("' + thumbSrc(i) + '")';
      timeline.insertBefore(btn, tooltip);
      thumbs.push(btn);
    }

    // Two crossfade layers: activeEl is the one currently shown.
    var activeEl  = layerA;
    var pendingEl = layerB;

    function setPage(n) {
      n = clamp(n);
      if (n === cur) { updateUI(); return; }
      cur = n;
      var newImgEl = pendingEl;
      newImgEl.src = src(n);
      var swap = function () {
        newImgEl.classList.add('is-active');
        activeEl.classList.remove('is-active');
        var tmp = activeEl;
        activeEl = newImgEl;
        pendingEl = tmp;
        updateUI();
      };
      if (newImgEl.complete && newImgEl.naturalWidth) {
        swap();
      } else {
        var done = false;
        newImgEl.onload = function () { if (!done) { done = true; swap(); } };
        setTimeout(function () { if (!done) { done = true; swap(); } }, 400);
      }
    }

    function updateUI() {
      counter.textContent = pad(cur) + ' / ' + pad(TOTAL);
      activeEl.setAttribute('alt', 'Atlas page ' + cur + ' of ' + TOTAL);
      // Swap stage bg: inner spreads sit on near-black so any 1px
      // gap during crossfade is invisible; covers sit on the page bg
      // (white) so the letterbox blends into the site.
      stage.classList.toggle('is-spread', !isCover(cur));
      // Mark the current thumb.
      for (var k = 0; k < thumbs.length; k++) {
        thumbs[k].classList.toggle('is-current', (k + 1) === cur);
      }
    }

    function nextAuto() { return cur === TOTAL ? 1 : cur + 1; }

    function tick() {
      tickTimer = null;
      if (paused) return;
      if (hovered) {
        if (cur < target)      setPage(cur + 1);
        else if (cur > target) setPage(cur - 1);
        tickTimer = setTimeout(tick, CHASE_MS);
      } else {
        setPage(nextAuto());
        tickTimer = setTimeout(tick, AUTO_MS);
      }
    }

    function restart() {
      if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }
      tickTimer = setTimeout(tick, hovered ? CHASE_MS : AUTO_MS);
    }

    function positionTooltip(idx, clientX) {
      var rect = timeline.getBoundingClientRect();
      var x = clientX != null
        ? Math.max(0, Math.min(rect.width, clientX - rect.left))
        : ((idx - 0.5) / TOTAL) * rect.width;
      tooltip.style.left = x + 'px';
      tooltip.textContent = pad(idx);
    }

    // Any pointermove inside the timeline — figure out which thumb
    // we're over by hit-testing (not by x/width math) so gap pixels
    // don't miscount as the neighbouring page.
    function onMove(e) {
      hovered = true;
      timeline.classList.add('is-hovered');
      var t = e.target;
      if (t && t.classList && t.classList.contains('atlas-book__thumb')) {
        var p = parseInt(t.getAttribute('data-page'), 10);
        if (p >= 1 && p <= TOTAL) {
          target = p;
          positionTooltip(p, e.clientX);
        }
      }
      restart();
    }
    function onLeave() {
      hovered = false;
      timeline.classList.remove('is-hovered');
      restart();
    }
    function onClick(e) {
      var t = e.target;
      if (!t || !t.classList || !t.classList.contains('atlas-book__thumb')) return;
      var p = parseInt(t.getAttribute('data-page'), 10);
      if (!(p >= 1 && p <= TOTAL)) return;
      // Direct jump on click/tap — no chase.
      setPage(p);
      target = p;
      positionTooltip(p, e.clientX);
      restart();
    }
    function onKey(e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); setPage(clamp(cur + 1)); restart(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); setPage(clamp(cur - 1)); restart(); }
      else if (e.key === 'Home')     { e.preventDefault(); setPage(1); restart(); }
      else if (e.key === 'End')      { e.preventDefault(); setPage(TOTAL); restart(); }
    }

    timeline.addEventListener('pointermove', onMove);
    timeline.addEventListener('pointerenter', onMove);
    timeline.addEventListener('pointerleave', onLeave);
    timeline.addEventListener('click', onClick);
    timeline.addEventListener('keydown', onKey);

    // ─── Mobile swipe (touch only) ───────────────────────────────
    // On narrow viewports, swiping across the stage advances or
    // rewinds by a single page. Guard by touch pointer type so
    // mouse / trackpad interaction on desktop is unaffected, and
    // require horizontal delta > vertical so vertical page scroll
    // through the stage still works.
    var SWIPE_MIN   = 40;      // px — ignore anything smaller
    var swipeStartX = 0;
    var swipeStartY = 0;
    var swipeActive = false;
    function isMobile() {
      return window.matchMedia('(max-width: 640px)').matches;
    }
    stage.addEventListener('pointerdown', function (e) {
      if (!isMobile() || e.pointerType !== 'touch') return;
      swipeActive  = true;
      swipeStartX  = e.clientX;
      swipeStartY  = e.clientY;
    });
    stage.addEventListener('pointerup', function (e) {
      if (!swipeActive) return;
      swipeActive = false;
      var dx = e.clientX - swipeStartX;
      var dy = e.clientY - swipeStartY;
      if (Math.abs(dx) < SWIPE_MIN) return;
      if (Math.abs(dy) > Math.abs(dx)) return;   // treat as vertical scroll
      if (dx < 0) {
        // Swipe left → next page (wraps 48 → 1).
        setPage(cur === TOTAL ? 1 : cur + 1);
      } else {
        // Swipe right → previous page (wraps 1 → 48).
        setPage(cur === 1 ? TOTAL : cur - 1);
      }
      restart();
    });
    stage.addEventListener('pointercancel', function () { swipeActive = false; });
    // Keep vertical page scroll through the stage working; only
    // horizontal gestures are claimed as swipes.
    stage.style.touchAction = 'pan-y';

    // Pause when the stage leaves the viewport or the tab is hidden.
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (ent) {
        paused = !ent.isIntersecting;
        if (!paused) restart();
      });
    }, { threshold: 0.1 });
    io.observe(book);
    document.addEventListener('visibilitychange', function () {
      paused = document.hidden;
      if (!paused) restart();
    });

    // Preload full-size pages for snappy transitions. Opening batch
    // is small (just the next 3 spreads) and the rest drip in slowly,
    // so Safari isn't asked to decode 48 full-resolution JPGs in
    // rapid succession when the section first opens. Dripping pauses
    // while the tab is hidden or the section is scrolled offscreen.
    for (var n = 2; n <= 4; n++) { var im = new Image(); im.src = src(n); }
    var preloadIdx = 5;
    var preloadTimer = setInterval(function () {
      if (preloadIdx > TOTAL) { clearInterval(preloadTimer); return; }
      if (paused) return;  // don't thrash when offscreen / tab hidden
      var im2 = new Image(); im2.src = src(preloadIdx++);
    }, 450);

    updateUI();
    restart();
  })();
  </script>
</body>
</html>
